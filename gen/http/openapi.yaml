swagger: "2.0"
info:
    title: Chorus Multi-Agent Coordination Server
    description: Token-optimal multi-agent coordination MCP server built on Goa-AI and Pulse.
    version: 0.6.0
host: localhost:80
consumes:
    - application/json
    - application/xml
    - application/gob
produces:
    - application/json
    - application/xml
    - application/gob
paths:
    /swarms:
        get:
            tags:
                - view
            summary: swarms view
            description: List, sorted by name, the swarms in which at least one agent that joined or called who is still active within the online window or watching. A swarm whose agents all went idle is not listed.
            operationId: view#swarms
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/ViewSwarmsResponseBody'
                        required:
                            - swarms
                "304":
                    description: 'not_modified: The swarm did not change before the wait ended.'
                    headers:
                        goa-attribute-fault:
                            description: Is the error a server-side fault?
                            type: boolean
                        goa-attribute-id:
                            description: ID is a unique identifier for this particular occurrence of the problem.
                            type: string
                        goa-attribute-message:
                            description: Message is a human-readable explanation specific to this occurrence of the problem.
                            type: string
                        goa-attribute-name:
                            description: Name is the name of this class of errors.
                            type: string
                        goa-attribute-temporary:
                            description: Is the error temporary?
                            type: boolean
                        goa-attribute-timeout:
                            description: Is the error a timeout?
                            type: boolean
                    examples:
                        application/json: {}
            schemes:
                - http
    /swarms/{swarm}/view:
        get:
            tags:
                - view
            summary: view view
            description: Return one swarm's agents, channels, inboxes, and retained messages. With if_none_match and wait, block until the snapshot differs or the wait ends.
            operationId: view#view
            parameters:
                - name: wait
                  in: query
                  description: Seconds to wait for a change when if_none_match matches the current snapshot.
                  required: false
                  type: integer
                  default: 0
                  maximum: 60
                  minimum: 0
                - name: swarm
                  in: path
                  description: Swarm name.
                  required: true
                  type: string
                  pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]{0,63}$
                - name: If-None-Match
                  in: header
                  description: ETag of the snapshot the caller already has.
                  required: false
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/SwarmView'
                        required:
                            - swarm
                            - agents
                            - channels
                            - inboxes
                    headers:
                        ETag:
                            description: Hash of the response body. Send it back as If-None-Match to wait for the next change.
                            type: string
                "304":
                    description: 'not_modified: The swarm did not change before the wait ended.'
                    headers:
                        goa-attribute-fault:
                            description: Is the error a server-side fault?
                            type: boolean
                        goa-attribute-id:
                            description: ID is a unique identifier for this particular occurrence of the problem.
                            type: string
                        goa-attribute-message:
                            description: Message is a human-readable explanation specific to this occurrence of the problem.
                            type: string
                        goa-attribute-name:
                            description: Name is the name of this class of errors.
                            type: string
                        goa-attribute-temporary:
                            description: Is the error temporary?
                            type: boolean
                        goa-attribute-timeout:
                            description: Is the error a timeout?
                            type: boolean
                    examples:
                        application/json: {}
            schemes:
                - http
definitions:
    Agent:
        title: Agent
        type: object
        properties:
            channels:
                type: array
                items:
                    type: string
                    example: Sed est enim eius eum necessitatibus.
                description: Channels the agent is subscribed to, sorted.
                example:
                    - '#arch'
            handle:
                type: string
                description: Agent handle (without '@').
                example: api
            last_seen_unix:
                type: integer
                description: Unix time in seconds of the agent's last Chorus call or watcher heartbeat.
                example: 1793467612
                format: int64
            model:
                type: string
                description: Model the agent declared on its most recent join or who ('human' for a person using the dashboard). Absent for agents registered before declaring a model was required.
                example: claude-opus-5-5
            role:
                type: string
                description: Role the agent advertised on join or who. Absent when none was given.
                example: API Engineer
            watching_on_this_server:
                type: boolean
                description: True when this server process is holding a blocking read or chorus watch for the agent. Another server process may hold one this process cannot see. Starting or stopping a watch does not end a wait on its own, so the value can lag until the next swarm change or the end of the wait.
                example: true
        description: A registered agent.
        example:
            channels:
                - '#arch'
            handle: api
            last_seen_unix: 1793467612
            model: claude-opus-5-5
            role: API Engineer
            watching_on_this_server: true
        required:
            - handle
            - last_seen_unix
            - channels
            - watching_on_this_server
    Channel:
        title: Channel
        type: object
        properties:
            head_seq:
                type: integer
                description: Sequence number of the latest message published to the channel.
                example: 14
                format: int64
                minimum: 0
            messages:
                type: array
                items:
                    $ref: '#/definitions/Message'
                description: Every retained message, oldest first. Older messages may have been trimmed.
                example:
                    - human: true
                      reply_to: 12
                      sender: db
                      sent_at_ms: 1793467612968
                      seq: 14
                      text: migration 004 applied
                    - human: true
                      reply_to: 12
                      sender: db
                      sent_at_ms: 1793467612968
                      seq: 14
                      text: migration 004 applied
                    - human: true
                      reply_to: 12
                      sender: db
                      sent_at_ms: 1793467612968
                      seq: 14
                      text: migration 004 applied
            name:
                type: string
                description: Channel name including '#'.
                example: '#arch'
            pin:
                $ref: '#/definitions/Pin'
            positions:
                type: array
                items:
                    $ref: '#/definitions/Position'
                description: Read position of every subscribed member, sorted by handle.
                example:
                    - behind: 2
                      handle: api
                      mentioned: true
                      read_seq: 12
                    - behind: 2
                      handle: api
                      mentioned: true
                      read_seq: 12
            topic:
                type: string
                description: Channel topic. Absent when none was set.
                example: Schema and API contract decisions
        description: A channel and its retained messages.
        example:
            head_seq: 14
            messages:
                - human: true
                  reply_to: 12
                  sender: db
                  sent_at_ms: 1793467612968
                  seq: 14
                  text: migration 004 applied
                - human: true
                  reply_to: 12
                  sender: db
                  sent_at_ms: 1793467612968
                  seq: 14
                  text: migration 004 applied
                - human: true
                  reply_to: 12
                  sender: db
                  sent_at_ms: 1793467612968
                  seq: 14
                  text: migration 004 applied
            name: '#arch'
            pin:
                human: true
                sender: lead
                seq: 1
                text: 'Goal: single-use passkey challenges | Verify: go test -race ./...'
            positions:
                - behind: 2
                  handle: api
                  mentioned: true
                  read_seq: 12
                - behind: 2
                  handle: api
                  mentioned: true
                  read_seq: 12
            topic: Schema and API contract decisions
        required:
            - name
            - head_seq
            - positions
            - messages
    Inbox:
        title: Inbox
        type: object
        properties:
            behind:
                type: integer
                description: 'head_seq minus read_seq: messages since the recipient last read its inbox.'
                example: 1
                format: int64
                minimum: 0
            head_seq:
                type: integer
                description: Sequence number of the latest message in the inbox.
                example: 3
                format: int64
                minimum: 0
            messages:
                type: array
                items:
                    $ref: '#/definitions/Message'
                description: Every retained message, oldest first. Older messages may have been trimmed.
                example:
                    - human: true
                      reply_to: 12
                      sender: db
                      sent_at_ms: 1793467612968
                      seq: 14
                      text: migration 004 applied
                    - human: true
                      reply_to: 12
                      sender: db
                      sent_at_ms: 1793467612968
                      seq: 14
                      text: migration 004 applied
                    - human: true
                      reply_to: 12
                      sender: db
                      sent_at_ms: 1793467612968
                      seq: 14
                      text: migration 004 applied
            read_seq:
                type: integer
                description: Sequence number up to which the recipient has read.
                example: 2
                format: int64
                minimum: 0
            recipient:
                type: string
                description: Handle the messages were sent to (without '@').
                example: api
        description: Direct messages sent to one recipient.
        example:
            behind: 1
            head_seq: 3
            messages:
                - human: true
                  reply_to: 12
                  sender: db
                  sent_at_ms: 1793467612968
                  seq: 14
                  text: migration 004 applied
                - human: true
                  reply_to: 12
                  sender: db
                  sent_at_ms: 1793467612968
                  seq: 14
                  text: migration 004 applied
                - human: true
                  reply_to: 12
                  sender: db
                  sent_at_ms: 1793467612968
                  seq: 14
                  text: migration 004 applied
            read_seq: 2
            recipient: api
        required:
            - recipient
            - head_seq
            - read_seq
            - behind
            - messages
    Message:
        title: Message
        type: object
        properties:
            human:
                type: boolean
                description: True when the sender had declared model 'human' when the message was sent. Absent otherwise, including for messages sent before senders declared a model.
                example: true
            reply_to:
                type: integer
                description: Sequence number the sender passed as reply_to. Absent when the message is not a reply. In a direct-message inbox the number is not guaranteed to refer to this inbox.
                example: 12
                format: int64
                minimum: 1
            sender:
                type: string
                description: Handle of the agent that sent the message (without '@').
                example: db
            sent_at_ms:
                type: integer
                description: Unix time in milliseconds when Redis stored the message, taken from its stream entry ID.
                example: 1793467612968
                format: int64
            seq:
                type: integer
                description: Sequence number within its channel or inbox (1, 2, ...).
                example: 14
                format: int64
                minimum: 1
            text:
                type: string
                description: Message body exactly as sent.
                example: migration 004 applied
        description: A retained channel post or direct message.
        example:
            human: true
            reply_to: 12
            sender: db
            sent_at_ms: 1793467612968
            seq: 14
            text: migration 004 applied
        required:
            - seq
            - sender
            - text
            - sent_at_ms
    Pin:
        title: Pin
        type: object
        properties:
            human:
                type: boolean
                description: True when the sender had declared model 'human' when the message was pinned. Absent otherwise.
                example: true
            sender:
                type: string
                description: Handle of the agent that pinned the message.
                example: lead
            seq:
                type: integer
                description: Sequence number of the pinned message in its channel.
                example: 1
                format: int64
                minimum: 1
            text:
                type: string
                description: Pinned message body exactly as sent.
                example: 'Goal: single-use passkey challenges | Verify: go test -race ./...'
        description: The channel's active pinned message.
        example:
            human: true
            sender: lead
            seq: 1
            text: 'Goal: single-use passkey challenges | Verify: go test -race ./...'
        required:
            - seq
            - sender
            - text
    Position:
        title: Position
        type: object
        properties:
            behind:
                type: integer
                description: 'Channel head_seq minus read_seq: messages since the member last read, sent, or joined.'
                example: 2
                format: int64
                minimum: 0
            handle:
                type: string
                description: Member handle (without '@').
                example: api
            mentioned:
                type: boolean
                description: True when the member was @-mentioned, @all-mentioned, or replied to after read_seq.
                example: true
            read_seq:
                type: integer
                description: Sequence number up to which the member has read, sent, or joined.
                example: 12
                format: int64
                minimum: 0
        description: A channel member's read position.
        example:
            behind: 2
            handle: api
            mentioned: true
            read_seq: 12
        required:
            - handle
            - read_seq
            - behind
            - mentioned
