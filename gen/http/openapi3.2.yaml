openapi: 3.2.0
info:
    title: Chorus Multi-Agent Coordination Server
    description: Token-optimal multi-agent coordination MCP server built on Goa-AI and Pulse.
    version: 0.6.0
servers:
    - url: http://localhost:80
      name: chorus
      description: Default server for chorus
paths:
    /swarms:
        get:
            tags:
                - view
            summary: swarms view
            description: List, sorted by name, the swarms in which at least one agent that joined or called who is still active within the online window or watching. A swarm whose agents all went idle is not listed.
            operationId: view#swarms
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SwarmsResponseBody'
                            example:
                                swarms:
                                    - chorus
                "304":
                    description: 'not_modified: The swarm did not change before the wait ended.'
                    headers:
                        goa-attribute-fault:
                            description: Is the error a server-side fault?
                            schema:
                                type: boolean
                                description: Is the error a server-side fault?
                                example: false
                            example: false
                        goa-attribute-id:
                            description: ID is a unique identifier for this particular occurrence of the problem.
                            schema:
                                type: string
                                description: ID is a unique identifier for this particular occurrence of the problem.
                                example: 123abc
                            example: 123abc
                        goa-attribute-message:
                            description: Message is a human-readable explanation specific to this occurrence of the problem.
                            schema:
                                type: string
                                description: Message is a human-readable explanation specific to this occurrence of the problem.
                                example: parameter 'p' must be an integer
                            example: parameter 'p' must be an integer
                        goa-attribute-name:
                            description: Name is the name of this class of errors.
                            schema:
                                type: string
                                description: Name is the name of this class of errors.
                                example: bad_request
                            example: bad_request
                        goa-attribute-temporary:
                            description: Is the error temporary?
                            schema:
                                type: boolean
                                description: Is the error temporary?
                                example: true
                            example: true
                        goa-attribute-timeout:
                            description: Is the error a timeout?
                            schema:
                                type: boolean
                                description: Is the error a timeout?
                                example: true
                            example: true
    /swarms/{swarm}/view:
        get:
            tags:
                - view
            summary: view view
            description: Return one swarm's agents, channels, inboxes, and retained messages. With if_none_match and wait, block until the snapshot differs or the wait ends.
            operationId: view#view
            parameters:
                - name: wait
                  in: query
                  description: Seconds to wait for a change when if_none_match matches the current snapshot.
                  allowEmptyValue: true
                  schema:
                    type: integer
                    description: Seconds to wait for a change when if_none_match matches the current snapshot.
                    default: 0
                    example: 25
                    format: int64
                    minimum: 0
                    maximum: 60
                  example: 25
                - name: swarm
                  in: path
                  description: Swarm name.
                  required: true
                  schema:
                    type: string
                    description: Swarm name.
                    example: chorus
                    pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]{0,63}$
                  example: chorus
                - name: If-None-Match
                  in: header
                  description: ETag of the snapshot the caller already has.
                  schema:
                    type: string
                    description: ETag of the snapshot the caller already has.
                    example: '"3f2a9c"'
                  example: '"3f2a9c"'
            responses:
                "200":
                    description: OK response.
                    headers:
                        ETag:
                            description: Hash of the response body. Send it back as If-None-Match to wait for the next change.
                            schema:
                                type: string
                                description: Hash of the response body. Send it back as If-None-Match to wait for the next change.
                                example: Doloribus accusamus quidem.
                            example: Doloribus accusamus quidem.
