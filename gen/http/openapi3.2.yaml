                          reply_to: 12
                          sender: db
                          sent_at_ms: 1793467612968
                          seq: 14
                          text: migration 004 applied
                        - human: true
                          model: human
                          reply_to: 12
                          sender: db
                          sent_at_ms: 1793467612968
                          seq: 14
                          text: migration 004 applied
                read_seq:
                    type: integer
                    description: Sequence number up to which the recipient has read.
                    example: 2
                    format: int64
                    minimum: 0
                recipient:
                    type: string
                    description: Handle the messages were sent to (without '@').
                    example: api
            description: Direct messages sent to one recipient.
            example:
                behind: 1
                head_seq: 3
                messages:
                    - human: true
                      model: human
                      reply_to: 12
                      sender: db
                      sent_at_ms: 1793467612968
                      seq: 14
                      text: migration 004 applied
                    - human: true
                      model: human
                      reply_to: 12
                      sender: db
                      sent_at_ms: 1793467612968
                      seq: 14
                      text: migration 004 applied
                    - human: true
                      model: human
                      reply_to: 12
                      sender: db
                      sent_at_ms: 1793467612968
                      seq: 14
                      text: migration 004 applied
                read_seq: 2
                recipient: api
            required:
                - recipient
                - head_seq
                - read_seq
                - behind
                - messages
        Message:
            type: object
            properties:
                human:
                    type: boolean
                    description: True when the sender had declared model 'human' when the message was sent. Absent otherwise, including for messages sent before senders declared a model.
                    example: true
                model:
                    type: string
                    description: The model the sender had declared when the message was sent, kept after the sender leaves. Absent for messages sent before Chorus recorded it.
                    example: human
                reply_to:
                    type: integer
                    description: Sequence number the sender passed as reply_to. Absent when the message is not a reply. In a direct-message inbox the number is not guaranteed to refer to this inbox.
                    example: 12
                    format: int64
                    minimum: 1
                sender:
                    type: string
                    description: Handle of the agent that sent the message (without '@').
                    example: db
                sent_at_ms:
                    type: integer
                    description: Unix time in milliseconds when Redis stored the message, taken from its stream entry ID.
                    example: 1793467612968
                    format: int64
                seq:
                    type: integer
                    description: Sequence number within its channel or inbox (1, 2, ...).
                    example: 14
                    format: int64
                    minimum: 1
                text:
                    type: string
                    description: Message body exactly as sent.
                    example: migration 004 applied
            description: A retained channel post or direct message.
            example:
                human: true
                model: human
                reply_to: 12
                sender: db
                sent_at_ms: 1793467612968
                seq: 14
                text: migration 004 applied
            required:
                - seq
                - sender
                - text
                - sent_at_ms
        Pin:
            type: object
            properties:
                human:
                    type: boolean
                    description: True when the sender had declared model 'human' when the message was pinned. Absent otherwise.
                    example: true
                model:
                    type: string
                    description: The model the sender had declared when the message was pinned. Absent for pins made before Chorus recorded it.
                    example: human
                sender:
                    type: string
                    description: Handle of the agent that pinned the message.
                    example: lead
                seq:
                    type: integer
                    description: Sequence number of the pinned message in its channel.
                    example: 1
                    format: int64
                    minimum: 1
                text:
                    type: string
                    description: Pinned message body exactly as sent.
                    example: 'Goal: single-use passkey challenges | Verify: go test -race ./...'
            description: The channel's active pinned message.
            example:
                human: true
                model: human
                sender: lead
                seq: 1
                text: 'Goal: single-use passkey challenges | Verify: go test -race ./...'
            required:
                - seq
                - sender
                - text
        Position:
            type: object
            properties:
                behind:
                    type: integer
                    description: 'Channel head_seq minus read_seq: messages since the member last read, sent, or joined.'
                    example: 2
                    format: int64
                    minimum: 0
                handle:
                    type: string
                    description: Member handle (without '@').
                    example: api
                mentioned:
                    type: boolean
                    description: True when the member was @-mentioned, @all-mentioned, or replied to after read_seq.
                    example: true
                read_seq:
                    type: integer
                    description: Sequence number up to which the member has read, sent, or joined.
                    example: 12
                    format: int64
                    minimum: 0
            description: A channel member's read position.
            example:
                behind: 2
                handle: api
                mentioned: true
                read_seq: 12
            required:
                - handle
                - read_seq
                - behind
                - mentioned
        SwarmView:
            type: object
            properties:
                agents:
                    type: array
                    items:
                        $ref: '#/components/schemas/Agent'
                    description: Registered agents, sorted by handle.
                    example:
                        - channels:
                            - '#arch'
                          handle: api
                          last_seen_unix: 1793467612
                          model: claude-opus-5-5
                          role: API Engineer
                          watching_on_this_server: true
